---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:

permissions: {}

jobs:
  test:
    name: Build, vet and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job here performs authenticated git operations, so the checkout
          # token does not need to stay in the git config afterwards.
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt reported unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # Pinned, not @latest: an unpinned tool changes CI behaviour without a
      # commit, and this is the linter the build gates on. Renovate bumps the
      # version below via the customManagers:githubActionsVersions preset, so
      # the pin still moves with a commit and a PR.
      - name: staticcheck
        env:
          # renovate: datasource=github-releases depName=dominikh/go-tools
          STATICCHECK_VERSION: 2026.2.1
        run: go run honnef.co/go/tools/cmd/staticcheck@"$STATICCHECK_VERSION" ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Build
        run: go build ./...

  govulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job here performs authenticated git operations, so the checkout
          # token does not need to stay in the git config afterwards.
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Reachability-aware: only fails on vulnerabilities this code can actually
      # reach, unlike a plain dependency-version scan. Pinned for the same
      # reason as staticcheck above.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
