---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:

permissions: {}

# Go and every tool come from mise.toml (Go through go.mod), so CI runs the same
# versions and the same tasks as `mise run all` locally. mise itself is pinned:
# an unpinned tool changes CI behaviour without a commit. Renovate bumps it via
# the customManagers:githubActionsVersions preset, and the tools via mise.toml.
env:
  # renovate: datasource=github-releases depName=jdx/mise
  MISE_VERSION: v2026.10.17

jobs:
  test:
    name: Build, vet and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job here performs authenticated git operations, so the checkout
          # token does not need to stay in the git config afterwards.
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: ${{ env.MISE_VERSION }}

      - name: Lint (gofmt, go vet, staticcheck)
        run: mise run lint

      - name: Test with race detector
        run: mise run test-race

      - name: Build
        run: mise run build

  govulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job here performs authenticated git operations, so the checkout
          # token does not need to stay in the git config afterwards.
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: ${{ env.MISE_VERSION }}

      - name: govulncheck
        run: mise run vuln
