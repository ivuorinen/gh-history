# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - binary: gh-history
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats: [binary]
    name_template: >-
      {{- .ProjectName }}_{{ .Os }}-{{ .Arch }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

signs:
  - cmd: cosign
    signature: "${artifact}.bundle"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

release:
  name_template: "{{.Tag}}"
  # The archives are binary-only and cannot carry extra files, so the project
  # licence travels with the release itself.
  #
  # Dependency notices are NOT shipped: the only direct requirement is
  # golang.org/x/term (BSD-3) with its transitive golang.org/x/sys. If that set
  # grows, generate notices into third_party/ during a `before` hook and add a
  # matching glob here — a glob for files no step produces would fail the release.
  extra_files:
    - glob: LICENSE
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
